<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSSCI Service Center - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --brand-400: #f69d3e;
            --brand-500: #ea7f12;
            --brand-600: #cb6708;
            --surface-0: #f2f6fb;
            --surface-1: #ffffff;
            --surface-2: #f4f8fd;
            --line: #d6deea;
            --text-900: #0f172a;
            --text-700: #344155;
            --text-500: #627087;
            --danger-500: #cb3a42;
            --shadow: 0 24px 60px rgba(15, 23, 42, 0.14);
            --radius: 1.1rem;
        }

        body {
            font-family: "Manrope", "Segoe UI", sans-serif;
            background:
                radial-gradient(900px 500px at 0% -10%, #ffe5c4 0%, transparent 60%),
                radial-gradient(900px 560px at 100% 0%, #d8eaff 0%, transparent 55%),
                var(--surface-0);
            color: var(--text-900);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.2rem;
        }

        .login-shell {
            width: min(940px, 100%);
            background: var(--surface-1);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(240px, 0.9fr) 1.1fr;
        }

        .login-brand {
            background:
                linear-gradient(170deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.04) 100%),
                linear-gradient(145deg, #18253b 0%, #263f61 100%);
            color: #f8fbff;
            padding: 2.2rem 1.6rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand-title {
            font-family: "Sora", "Manrope", sans-serif;
            font-size: 1.28rem;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 0.85rem;
        }

        .brand-subtitle {
            color: rgba(243, 248, 255, 0.78);
            font-size: 0.9rem;
            margin: 0;
            max-width: 22ch;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            width: fit-content;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.94);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.3rem 0.62rem;
            letter-spacing: 0.03em;
        }

        .login-panel {
            padding: 2.2rem 2rem;
            background: linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
        }

        .login-header {
            margin-bottom: 1.65rem;
        }

        .login-header h1 {
            font-family: "Sora", "Manrope", sans-serif;
            font-size: 1.42rem;
            font-weight: 700;
            color: var(--text-900);
            margin-bottom: 0.45rem;
        }

        .login-header p {
            color: var(--text-500);
            margin: 0;
        }

        .form-label {
            font-weight: 700;
            color: var(--text-700);
            font-size: 0.84rem;
        }

        .form-control {
            border: 1px solid #bfcbdb;
            border-radius: 0.72rem;
            min-height: 2.6rem;
            color: var(--text-900);
        }

        .form-control:focus {
            border-color: #87bfd3;
            box-shadow: 0 0 0 0.22rem rgba(0, 138, 147, 0.15);
        }

        .btn-login {
            border-color: var(--brand-500);
            background: linear-gradient(145deg, var(--brand-500) 0%, var(--brand-400) 100%);
            color: white;
            width: 100%;
            min-height: 2.75rem;
            font-size: 0.92rem;
            font-weight: 700;
            border-radius: 0.72rem;
            box-shadow: 0 10px 18px rgba(234, 127, 18, 0.3);
            transition: all 0.2s ease;
        }

        .btn-login:hover,
        .btn-login:focus {
            border-color: var(--brand-600);
            background: linear-gradient(145deg, var(--brand-600) 0%, var(--brand-500) 100%);
            color: white;
            transform: translateY(-1px);
        }

        .alert-danger {
            border: 1px solid #f2bec2;
            border-left: 4px solid var(--danger-500);
            background: #fff1f2;
            color: #7d2227;
            border-radius: 0.74rem;
            font-size: 0.84rem;
        }

        @media (max-width: 900px) {
            .login-shell {
                grid-template-columns: 1fr;
            }

            .login-brand {
                gap: 1rem;
                min-height: 155px;
            }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <aside class="login-brand">
            <div>
                <div class="brand-badge">SECURE OPERATION</div>
                <h2 class="brand-title mt-3">BSSCI Service Center</h2>
                <p class="brand-subtitle">Central dashboard for MIOTY base stations, sensors and secure service controls.</p>
            </div>
            <small class="text-white-50">secure login</small>
        </aside>

        <section class="login-panel">
            <div class="login-header">
                <h1>Sign in</h1>
                <p>Use your account credentials to continue.</p>
            </div>

            {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required autofocus>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-login">Sign in</button>
            </form>
        </section>
    </div>
</body>
</html>
